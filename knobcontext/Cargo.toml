[package]
name = "knobcontext"
version = "0.1.0"
edition = "2021"
description = "Global HID knob mapper and context overlay"

[dependencies]
base64 = "0.22"
ctrlc = "3.5"
env_logger = "0.11"
hidapi = "2.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
log = "0.4"
open = "5"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "1"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6", default-features = false, features = ["wayland"] }
evdev = "0.12"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
slint = { version = "1.19", default-features = false, features = ["std", "backend-winit-wayland", "renderer-software", "software-renderer-systemfonts", "compat-1-2"] }

[target.'cfg(target_os = "windows")'.dependencies]
enigo = "0.6"
slint = { version = "1.19", default-features = false, features = ["std", "backend-winit", "renderer-software", "renderer-femtovg", "software-renderer-systemfonts", "compat-1-2"] }
tray-icon = "0.21"
windows = { version = "0.62", features = [
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_Com",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.19"
