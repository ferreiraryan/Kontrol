[package]
name = "knobcontext"
version = "0.1.0"
edition = "2021"
description = "Global HID knob mapper and context overlay"

[dependencies]
ctrlc = "3.5"
enigo = { version = "0.6", default-features = false, features = ["wayland"] }
env_logger = "0.11"
evdev = "0.12"
hidapi = "2.6"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
