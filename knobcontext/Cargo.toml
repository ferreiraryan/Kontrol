[package]
name = "knobcontext"
version = "0.1.0"
edition = "2021"
description = "Global HID knob mapper and context overlay"

[dependencies]
ctrlc = "3.5"
enigo = { version = "0.6", default-features = false, features = ["wayland"] }
env_logger = "0.11"
evdev = "0.12"
hidapi = "2.6"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
log = "0.4"
open = "5"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.19", default-features = false, features = ["std", "backend-winit-wayland", "renderer-software", "software-renderer-systemfonts", "compat-1-2"] }
thiserror = "2"
toml = "1"

[build-dependencies]
slint-build = "1.19"
